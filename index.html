
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>定时任务监控看板</title>
<style>
  :root {
    --bg:#f5f7fa; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
    --ok:#10B981; --err:#EF4444; --warn:#F59E0B; --gray:#6B7280; --primary:#2563EB;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
         font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
         font-size:14px; padding:20px 16px 48px; }
  .mono { font-family:"JetBrains Mono",Consolas,"Courier New",monospace;
          font-variant-numeric:tabular-nums; }
  .wrap { max-width:1200px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px; }
  h1 { font-size:22px; }
  h2 { font-size:15px; margin:30px 0 12px; color:#374151; letter-spacing:.3px; }
  .meta { color:var(--muted); font-size:12px; }
  .tbtn { padding:5px 12px; border:1px solid var(--line); background:#fff; border-radius:8px;
          cursor:pointer; font-size:12.5px; color:var(--muted); }
  .tbtn:hover { background:#f3f4f6; }
  body.tv .tbtn.on { background:#1e293b; color:#fff; border-color:#1e293b; }

  #alertBanner { display:none; background:#fef2f2; border:1.5px solid var(--err); border-radius:10px;
                 padding:10px 14px; margin-bottom:16px; }
  #alertBanner.show { display:block; }
  #alertBanner .line { color:#991b1b; font-size:13.5px; font-weight:600; padding:2px 0; }
  #alertBanner .sub { font-weight:400; color:#b91c1c; font-size:12px; }

  /* ---- KPI：4 列等宽栅格 ---- */
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card .k { color:var(--muted); font-size:12px; margin-bottom:8px; display:flex; align-items:center; gap:5px; }
  .card .v { font-size:24px; font-weight:700; line-height:1.2; }
  .card .s { color:var(--muted); font-size:11.5px; margin-top:8px; line-height:1.6; }
  /* 动态状态卡：正常=白底绿字小巧；异常=整卡红底白字突变 */
  .card.stat-ok { display:flex; align-items:center; gap:12px; }
  .card.stat-ok .okicon { width:42px; height:42px; flex:none; }
  .card.stat-ok .v { font-size:19px; color:var(--ok); }
  .card.stat-ok .s { margin-top:2px; }
  .card.stat-bad { color:#fff; border:none; background:linear-gradient(135deg,#DC2626,#F59E0B); }
  .card.stat-bad .k, .card.stat-bad .s { color:rgba(255,255,255,.88); }
  .card.stat-bad .v { font-size:40px; }
  /* 进度条 */
  .pbar { height:8px; border-radius:999px; background:#EEF2F6; margin-top:10px; overflow:hidden; }
  .pbar i { display:block; height:100%; border-radius:999px; background:var(--ok);
            box-shadow:inset 0 -1px 0 rgba(0,0,0,.06); }
  .pbar i.part { background:var(--warn); }
  /* 成功率卡：端到端为主数字（核心业务指标），任务执行为次数字 */
  .duo { display:flex; gap:20px; margin-top:2px; align-items:flex-end; }
  .duo .lbl { color:var(--muted); font-size:11px; margin-top:2px; }
  .duo .big { font-size:30px; font-weight:700; line-height:1.1; }
  .duo .big.red { color:#DC2626; }
  .duo .sub { font-size:17px; font-weight:600; line-height:1.4; color:#374151; }
  /* 成功率卡：三色堆叠构成条 */
  .stackbar { display:flex; height:10px; border-radius:999px; overflow:hidden; margin-top:10px; background:#EEF2F6; }
  .stackbar i { display:block; min-width:3px; }
  .slegend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:6px; align-items:center; }
  .slegend i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:3px; flex:none; }
  .hint { position:relative; display:inline-flex; width:15px; height:15px; border-radius:50%;
          background:#eef2f7; color:var(--muted); font-size:10.5px; cursor:help;
          align-items:center; justify-content:center; flex:none; }
  .hint .tipbox { display:none; position:absolute; top:20px; left:-10px; width:300px; z-index:30;
          background:#111827; color:#e5e7eb; border-radius:10px; padding:12px 14px;
          font-size:11.5px; line-height:1.7; text-align:left; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .hint:hover .tipbox { display:block; }
  .hint .tipbox b { color:#fff; }
  .up { color:#15803d; font-weight:600; font-size:12px; } .down { color:#b91c1c; font-weight:600; font-size:12px; }

  /* ---- 根因聚块（全局告警横幅：主标题/副标题分层 + 左侧警示粗边） ---- */
  .causeBox { background:#FFFBEB; border:1px solid #FDE68A; border-left:4px solid #F59E0B;
              border-radius:12px; padding:12px 16px; margin-top:14px; font-size:13px;
              box-shadow:0 1px 4px rgba(245,158,11,.10); }
  .causeBox .ctitle { font-size:14.5px; font-weight:700; color:#78350F; }
  .causeBox .csub { font-size:12px; color:#A16207; font-weight:400; margin:3px 0 6px; }
  .causeBox .crow { padding:3px 0; }
  .causeBox .cdot { display:inline-block; width:8px; height:8px; border-radius:50%;
                    background:var(--err); margin-right:6px; }
  .causeBox .clink { display:inline-block; padding:4px 12px; border:1px solid #FDE68A; background:#fff;
                     color:#92400E; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600;
                     box-shadow:0 1px 3px rgba(146,64,14,.15); }
  .causeBox .clink:hover { text-decoration:underline; background:#FEF9E7; }
  .causeBox .cbtn { padding:4px 12px; border:1px solid #FDE68A; background:#fff; color:#92400E;
                    border-radius:8px; cursor:pointer; font-size:12px;
                    box-shadow:0 1px 3px rgba(146,64,14,.15); }
  .causeBox .cbtn:hover { background:#FEF9E7; }

  /* ---- 未登记任务提示（蓝色信息横幅，区别于失败黄色系） ---- */
  .unregBox { background:#EFF6FF; border:1px solid #BFDBFE; border-left:4px solid var(--primary);
              border-radius:12px; padding:12px 16px; margin-top:14px; font-size:13px; }
  .unregBox .utitle { font-weight:700; color:#1E40AF; }
  .unregBox .crow2 { padding:2px 0; color:#1E3A8A; }
  .unregBox summary { cursor:pointer; color:var(--primary); font-size:12.5px;
                      margin-top:6px; font-weight:600; }
  .unregBox details { margin-top:4px; }
  .unregBox pre { background:#F8FAFC; color:#374151; margin-top:6px; }

  /* ---- 筛选胶囊栏（弱化未选中，与卡片间分隔线） ---- */
  #filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap;
             border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
  #filters select { padding:5px 10px; border:1px solid var(--line); border-radius:8px;
                    background:#fff; font-size:13px; margin-right:6px; }
  .chip { border:none; background:transparent; color:var(--muted); border-radius:999px;
          padding:5px 12px; font-size:12.5px; cursor:pointer; user-select:none;
          display:inline-flex; align-items:center; gap:5px; }
  .chip .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .chip:not(.off) { background:#EEF2F7; color:var(--text); font-weight:600; }
  .chip.off { opacity:.55; }
  .chip b { font-weight:700; }

  /* ---- 任务卡 ---- */
  #taskGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; align-items:stretch; }
  .task { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0 16px 14px;
          cursor:pointer; position:relative; display:flex; flex-direction:column;
          transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .task:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(15,23,42,.10); border-color:#cbd5e1; }
  /* 告警只走卡内告警条单一通道；仅红级保留边框强化 */
  .task.alarm-red { border-color:var(--err); box-shadow:0 0 0 1px var(--err); }
  .task-alert { margin:0 -16px; padding:7px 16px; border-radius:12px 12px 0 0; color:#fff;
                font-size:12.5px; font-weight:600; }
  .task-alert.red { background:var(--err); } .task-alert.orange { background:var(--warn); }
  .task-alert.yellow { background:#FEF3C7; color:#92400E; }
  .task-alert.note { background:var(--gray); font-weight:400; }
  .thead { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding-top:14px; }
  .task .name { font-weight:700; font-size:15.5px; }
  .task .ptitle { color:var(--muted); font-size:11.5px; margin-top:3px; }
  .ghost { flex:none; font-size:11.5px; color:var(--primary); border:1px solid #DBEAFE;
           background:#EFF6FF; border-radius:7px; padding:3px 9px; opacity:0; transition:opacity .12s; }
  .task:hover .ghost { opacity:1; }
  .statline { display:flex; gap:18px; margin-top:12px; flex-wrap:wrap; align-items:flex-end;
              padding:10px 2px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); }
  .statline .sep { width:1px; height:30px; background:#E2E8F0; flex:none; align-self:center; }
  .stat i { font-style:normal; color:var(--muted); font-size:11px; display:block; margin-bottom:3px; }
  .stat b { font-size:18px; font-weight:700; color:#111827; }
  .stat b em { font-style:normal; font-size:11px; color:var(--muted); font-weight:400; }
  .task .row { margin-top:9px; font-size:12.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:58px; margin-top:14px; position:relative; }
  .band { position:absolute; left:0; right:0; background:rgba(100,116,139,.13);
          border-top:1px dashed #94a3b8; border-bottom:1px dashed #94a3b8; pointer-events:none; }
  .bar { flex:1; min-width:6px; max-width:30px; border-radius:3px 3px 0 0; position:relative; }
  .bar:hover::after { content:attr(data-tip); position:absolute; bottom:110%; left:50%;
          transform:translateX(-50%); background:#111827; color:#fff; font-size:11px;
          padding:3px 7px; border-radius:5px; white-space:nowrap; z-index:9; }
  .bar.latest::before { content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
          width:7px; height:7px; border-radius:50%; background:#1f2937; }
  .bars .ymax { position:absolute; top:-4px; right:0; font-size:10px; color:#94A3B8;
                background:rgba(255,255,255,.8); padding:0 3px; border-radius:4px; pointer-events:none; }
  .daterow { display:flex; gap:4px; border-top:1px solid var(--line); padding-top:4px; }
  .daterow span { flex:1; min-width:6px; max-width:30px; text-align:center; font-size:10.5px;
                  color:var(--muted); overflow:hidden; white-space:nowrap; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:auto; padding-top:8px;
            border-top:1px dashed var(--line); font-size:10.5px; color:var(--muted); }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; }
  .cline { position:absolute; top:-7px; bottom:0; width:0;
           border-left:1.5px dashed #b45309; pointer-events:auto; cursor:help; }

  /* ---- 历史表：sticky 表头 + 斑马纹 ---- */
  .tablewrap { overflow:auto; max-height:68vh; border:1px solid var(--line); border-radius:12px;
               background:var(--card); }
  table { width:100%; border-collapse:separate; border-spacing:0; }
  th,td { padding:11px 14px; border-bottom:1px solid #f1f5f9; text-align:left;
          font-size:13px; vertical-align:top; }
  th { background:#F8FAFC; color:var(--muted); font-weight:600; font-size:12px;
       position:sticky; top:0; z-index:5; }
  th.r, td.r { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:nth-child(even) td { background:#FAFBFC; }
  td.taskname { white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
  /* 备注列：最多两行截断（悬停看全文 title） */
  td.note { max-width:300px; }
  td.note .clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                    overflow:hidden; word-break:break-all; line-height:1.55; }
  td.stcell { white-space:nowrap; }
  td .num { font-variant-numeric:tabular-nums; }
  td .zero { color:#9ca3af; } td .hot { color:var(--err); font-weight:700; }
  tr.rec { cursor:pointer; border-left:3px solid transparent; }
  tr.rec:hover td { background:#F1F5F9; }
  td .skip { color:#9ca3af; font-size:11px; }
  td .slow { color:#B45309; font-weight:600; }
  tfoot td { background:#F8FAFC; font-size:12.5px; position:sticky; bottom:0;
             border-top:2px solid var(--line); color:#374151; z-index:4; }
  #loadMoreWrap { text-align:center; margin-top:12px; }
  #loadMoreWrap button { padding:6px 18px; border:1px solid var(--line); background:#fff;
          border-radius:8px; cursor:pointer; font-size:13px; }
  #loadMoreWrap button:hover { background:#f3f4f6; }
  .warn { background:#FFFBEB; border:1px solid #FDE68A; border-radius:10px; padding:10px 14px;
          margin-top:16px; font-size:13px; }
  .warn details { margin-top:6px; }
  footer { margin-top:30px; color:var(--muted); font-size:12px; text-align:center; line-height:1.8; }
  .muted { color:var(--muted); }

  /* ---- 侧边抽屉：结构化分块 + 底部主 CTA ---- */
  #drawerMask { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:40;
               opacity:0; pointer-events:none; transition:opacity .18s ease; }
  #drawerMask.show { opacity:1; pointer-events:auto; }
  #drawer { position:fixed; top:0; right:-46vw; width:min(46vw,640px); min-width:480px; height:100vh;
            background:#fff; box-shadow:-8px 0 32px rgba(0,0,0,.18); z-index:41;
            transition:right .18s ease; display:flex; flex-direction:column; }
  #drawer.show { right:0; }
  #drawer .dbody { flex:1; overflow-y:auto; padding:18px 22px 10px; }
  #drawer h3 { font-size:17px; margin-bottom:2px; }
  #drawer .dsub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  #drawer .close { float:right; border:none; background:none; font-size:22px; cursor:pointer; color:var(--muted); }
  .sect { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.8px; margin:14px 0 6px; }
  .kv { display:grid; grid-template-columns:96px 1fr; gap:6px 10px; font-size:13px;
        background:#F8FAFC; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kv .k2 { color:var(--muted); }
  .kv .v2 { word-break:break-all; }
  .kv .v2 .num { color:#B91C1C; font-weight:700; }
  .kv mark { background:#FEF3C7; color:#92400E; padding:0 2px; border-radius:3px; }
  pre.raw mark.qmark { background:#FDE68A; color:#78350F; border-radius:2px; }
  .loghead { display:flex; justify-content:space-between; align-items:center; margin:14px 0 6px; }
  .loghead .lnk { border:none; background:none; color:var(--primary); font-size:12.5px;
                  font-weight:600; cursor:pointer; padding:2px 4px; border-radius:6px; }
  .loghead .lnk:hover { text-decoration:underline; background:#EFF6FF; }
  .loghead input { width:130px; }
  #drawer pre.raw { max-height:40vh; overflow-y:auto; background:#0F172A; color:#CBD5E1;
            border-radius:10px; padding:12px 14px; }
  pre.raw { white-space:pre-wrap; word-break:break-all; font-size:12px;
            font-family:"JetBrains Mono",Consolas,monospace; }
  pre.raw .ltime { color:#64748B; }
  pre.raw .ldim { color:#64748B; font-style:italic; }
  pre.raw .lok { color:#34D399; }
  pre.raw .lerr { color:#F87171; }
  pre.raw span.lerrline { color:#FCA5A5; font-weight:600; }
  pre.raw span.lokline { color:#86EFAC; }
  /* 底部固定主按钮 */
  .dfoot { flex:none; border-top:1px solid var(--line); padding:12px 22px; background:#fff; }
  .dfoot .cta { width:100%; padding:11px 0; border:none; border-radius:10px; background:var(--primary);
        color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .dfoot .cta:hover { background:#1D4ED8; }
  .dfoot .cta.env { background:var(--warn); }
  .dfoot .cta.env:hover { background:#D97706; }
  .dfoot .noop { text-align:center; color:var(--muted); font-size:12px; padding:6px 0; }
  .dfoot .noop.ok { color:#047857; background:#ECFDF5; border-radius:10px;
                    display:flex; align-items:center; justify-content:center; gap:6px;
                    padding:9px 0; font-weight:600; }
  /* Toast */
  #toast { position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
           background:#111827; color:#fff; font-size:13px; padding:10px 20px; border-radius:10px;
           opacity:0; pointer-events:none; transition:all .25s ease; z-index:60;
           box-shadow:0 8px 24px rgba(0,0,0,.3); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- 交互优化：滚动锁 / 选中任务卡 / 重置筛选 / 键盘焦点 ---- */
  body.dlock { overflow:hidden; }
  .task.sel { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .task.sel:hover { border-color:var(--primary); }
  .resetChip { border:1px solid var(--line); background:#fff; color:var(--err);
               border-radius:999px; padding:4px 12px; font-size:12.5px; cursor:pointer; }
  .resetChip:hover { background:#FEF2F2; border-color:var(--err); }
  tr.rec:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
  .tbtn:focus-visible, .chip:focus-visible, button:focus-visible, .close:focus-visible {
      outline:2px solid var(--primary); outline-offset:1px; border-radius:6px; }

  /* ---- 抽屉↔主表联动高亮 ---- */
  tr.rec.rowhl td { background:#EFF6FF !important; }
  tr.rec.rowhl { border-left-color:var(--primary); }
  /* ---- 分页器 ---- */
  #loadMoreWrap .pg { display:inline-flex; align-items:center; gap:10px; margin-top:12px;
          font-size:12.5px; color:var(--muted); }
  #loadMoreWrap .pg button { padding:4px 14px; border:1px solid var(--line); background:#fff;
          border-radius:8px; cursor:pointer; font-size:12.5px; color:var(--text); }
  #loadMoreWrap .pg button:hover:not(:disabled) { background:#f3f4f6; }
  #loadMoreWrap .pg button:disabled { opacity:.4; cursor:not-allowed; }
  /* ---- 柱状图峰值虚线 ---- */
  .bars .peakline { position:absolute; left:0; right:0; top:0; border-top:1px dashed #94A3B8;
          pointer-events:none; }
  /* ---- 依赖健康度推导卡 ---- */
  #depHealth { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;
          background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:9px 14px; font-size:12.5px; color:#374151; }
  #depHealth .ddot { width:9px; height:9px; border-radius:50%; flex:none; }
  #depHealth .muted { font-size:11.5px; }

  /* ---- 降噪：观察说明 pill（非告警，浅靛蓝，挂在任务名旁） ---- */
  .npill { display:inline-block; vertical-align:1px; margin-left:6px; padding:1px 8px;
           border-radius:999px; background:#EEF2FF; color:#4338CA; border:1px solid #C7D2FE;
           font-size:10.5px; font-weight:400; max-width:230px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; cursor:help; }
  /* ---- 状态列次要信息微标签（与主状态拉开层级） ---- */
  .mini { display:inline-block; font-size:10.5px; padding:0 6px; border-radius:999px;
          line-height:16px; vertical-align:1px; background:#F3F4F6; color:#6B7280;
          border:1px solid #E5E7EB; cursor:help; white-space:nowrap; }
  .mini.blue { background:#EFF6FF; color:#1D4ED8; border-color:#BFDBFE; }
  .mini.amber { background:#FFFBEB; color:#92400E; border-color:#FDE68A; }
  /* ---- 可排序表头 ---- */
  th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
  th.sortable:hover { color:var(--primary); }
  th.sortable .arr { font-size:10px; color:var(--primary); }
  /* ---- 数据延迟兜底条 ---- */
  #staleBar { display:none; background:#FFFBEB; border:1.5px solid var(--warn);
              border-radius:10px; padding:10px 14px; margin-bottom:16px;
              color:#92400E; font-size:13px; font-weight:600;
              position:sticky; top:8px; z-index:100; box-shadow:0 4px 14px rgba(245,158,11,.25); }
  #staleBar.show { display:block; }
  /* ---- 抽屉记录跳转下拉 ---- */
  #dnav { font-size:11px; padding:1px 4px; border:1px solid var(--line);
          border-radius:6px; background:#fff; color:var(--muted); max-width:250px; }

    <b>口径</b>：成功率 =（成功 + 零新增 + 推送失败）/ 全部执行尝试 —— <b>数据已落库即算成功</b>（推送失败≠数据失败；微信推送链路已于 10-08 退役为静默留档，不再参与口径）。中止 / 漏跑不入分母。<br>
    <b>样本</b>：${k.samples} 条（近 7 天窗口，环比上一窗口）<br>
    ${(k.week_comp&&k.week_comp.push_failed>0&&Object.keys(pfR).length)?'<b>推送失败（历史）</b>：'+Object.entries(pfR).map(([r,c])=>esc(r)+' ×'+c).join('；')+'；均为 10-08 切静默前的旧口径产物，随 7 天窗口滑动消失<br>':''}
    <b>近 7 天链路构成</b>${funnelHtml(k.funnel)}
  </span></span>`;
  const cards = [
    alertZero
      ? `<div class="card stat-ok">${okIcon}
           <div><div class="v">今日全部正常</div>
           <div class="s">无执行失败 / 中止 / 推送失败 / 漏跑${
             healedN?`<br>另有 ${healedN} 起失败已由自动重试自愈：${healedTxt}`:''}</div></div></div>`
      : `<div class="card stat-bad">
           <div class="k">今日异常 / 失败（${today}）</div>
           <div class="v mono">${k.alert_total}</div>
           <div class="s">${esc(brk)}${healedN?`<br>另有 ${healedN} 起失败已由重试自愈（不计入）：${healedTxt}`:''}<br>近 7 天累计 ${k.week_alert_total||0} 起${
             (k.week_break&&(k.week_break.failed||k.week_break.aborted))
               ? `（执行失败 ${k.week_break.failed||0} · 中止 ${k.week_break.aborted||0} · 推送失败 ${k.week_break.push_failed||0}）` : ''}</div></div>`,
    `<div class="card"><div class="k">今日已跑</div>
       <div class="v mono" style="${pct===100?'color:var(--ok)':''}">${pct===100?'✓ ':''}${k.ran_today} <span style="font-size:15px;color:var(--muted);font-weight:400">/ ${k.task_count}</span></div>
       <div class="pbar"><i class="${pct<100?'part':''}" style="width:${pct}%"></i></div>
       <div class="s">${k.not_ran.length ? '未跑：'+esc(k.not_ran.join('、')) : '在监任务全部已跑'}</div></div>`,
    `<div class="card"><div class="k">近 7 天成功率（${k.samples} 次执行）${rateTip}</div>
       <div class="v mono">${k.exec_rate==null?'-':k.exec_rate+'%'}</div>
       <div class="s">数据落库即成功 ${deltaHtml(k.exec_delta)}；构成见下方色条${(k.week_comp&&k.week_comp.push_failed>0)?'（橙段为 10-08 前推送链路的历史遗留）':''}</div>
       ${stackBarHtml(k)}
       ${sparkSvg(k.spark)}</div>`,
    `<div class="card"><div class="k">在监任务数</div>
       <div class="v mono">${k.task_count}</div>
       <div class="s">${esc(k.task_names.join('、'))}</div></div>`,
  ];
  document.getElementById("summary").innerHTML = cards.join("");
  document.getElementById("genAt").textContent = DATA.generated_at;
}

/* ---------- 根因聚块 ---------- */
function renderCauses(){
  const el = document.getElementById("causeBlock");
  const cs = DATA.root_causes || [];
  if(!cs.length){ el.innerHTML = ""; return; }
  const total = cs.reduce((a,c)=>a+c.count,0);
  el.innerHTML = `<div class="causeBox">
    <div class="ctitle">⚠ 近 7 天执行失败 / 中止 ${total} 起</div>
    <div class="csub">按根因聚类 —— 同一老毛病反复出现 ≠ 多个独立故障：</div>
    ${cs.map(c=>`<div class="crow"><span class="cdot"></span><b>${esc(c.cause)} ×${c.count}</b>
      <span class="muted">（${c.dates.map(d=>d.slice(5)).join(" / ")}）</span>
      <span class="muted" style="font-size:12px">→ ${esc(c.hint)}</span></div>`).join("")}
    <div style="display:flex;gap:12px;margin-top:8px;align-items:center;flex-wrap:wrap">
      <span class="clink" onclick="showCauseRecords()">查看这 ${total} 条记录 →</span>
      <button class="cbtn" onclick="copyCauseGuide()">📋 复制修复指南</button>
      <span class="muted" style="font-size:11px">（过滤运行历史为 近7天 · 执行失败+中止）</span>
    </div>
  </div>`;
}
function showCauseRecords(){
  fStates.clear(); fStates.add("failed"); fStates.add("aborted");
  fTask = "__all__"; rangeMode = "7d"; pageNo = 1;
  const sel = document.getElementById("taskSel"); if(sel) sel.value = "__all__";
  renderFilters(); renderTasks(); renderHistTools(); renderTimeline();
  document.getElementById("histTools").scrollIntoView({behavior:"smooth"});
  toast("已过滤：近 7 天 · 执行失败 + 中止");
}
function copyCauseGuide(){
  const cs = DATA.root_causes || [];
  const txt = cs.map(c=>`【${c.cause}】×${c.count}（${c.dates.map(d=>d.slice(5)).join(" / ")}）\n处置：${c.hint}`).join("\n\n");
  const done = ()=>toast("✅ 修复指南已复制到剪贴板");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}

/* ---------- 筛选胶囊栏 ---------- */
function renderFilters(){
  const sel = document.createElement("select");
  sel.id = "taskSel";
  sel.innerHTML = '<option value="__all__">全部任务</option>' +
    DATA.tasks.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  sel.onchange = ()=>{ fTask = sel.value; pageNo = 1; renderTasks(); renderTimeline(); };
  const box = document.getElementById("filters");
  const rangeTag = document.createElement("span");
  rangeTag.id = "chipRangeTag"; rangeTag.className = "meta";
  box.innerHTML = ""; box.appendChild(sel); box.appendChild(rangeTag);
  SO.forEach(st=>{
    const b = document.createElement("span");
    b.className = "chip" + (fStates.has(st)?"":" off");
    b.dataset.st = st;
    b.innerHTML = `<i class="dot" style="background:${SC[st]}"></i>${SL[st]} <b>0</b>`;
    b.title = "计数随下方「运行历史」的时间范围联动";
    b.onclick = ()=>{ fStates.has(st) ? fStates.delete(st) : fStates.add(st);
                      b.classList.toggle("off", !fStates.has(st));
                      pageNo = 1; renderTasks(); renderTimeline(); };
    box.appendChild(b);
  });
  const tip = document.createElement("span");
  tip.className = "meta"; tip.textContent = "（点击任务卡可筛选其记录）";
  box.appendChild(tip);
  const rst = document.createElement("button");
  rst.id = "resetChip"; rst.className = "resetChip"; rst.textContent = "↺ 重置筛选";
  rst.style.display = "none"; rst.onclick = resetFilters;
  box.appendChild(rst);
}
/* 筛选非默认时显示「重置」，一键还原任务/状态/范围/自定义日期 */
function filtersDirty(){
  return fTask!=="__all__" || fStates.size!==SO.length || rangeMode!=="all" || rangeFrom || rangeTo;
}
function resetFilters(){
  fTask = "__all__"; SO.forEach(s=>fStates.add(s));
  rangeMode = "all"; rangeFrom = ""; rangeTo = ""; pageNo = 1;
  renderFilters(); renderTasks(); renderHistTools(); renderTimeline();
  toast("已恢复默认筛选");
}
const RANGE_NAME = {all:"全量", today:"今天", "7d":"近7天", "30d":"近30天", custom:"自定义"};
function updateChipCounts(){
  const counts = {};
  DATA.records.forEach(r=>{ if(inRange(r)) counts[r.state]=(counts[r.state]||0)+1; });
  const tag = document.getElementById("chipRangeTag");
  if(tag) tag.textContent = RANGE_NAME[rangeMode] + "：";
  document.querySelectorAll("#filters .chip").forEach(ch=>{
    const st = ch.dataset.st;
    ch.innerHTML = `<i class="dot" style="background:${SC[st]}"></i>${SL[st]} <b>${counts[st]||0}</b>`;
  });
  const rc = document.getElementById("resetChip");
  if(rc) rc.style.display = filtersDirty() ? "" : "none";
}
function setTaskFilter(id){
  fTask = id;
  const sel = document.getElementById("taskSel"); if(sel) sel.value = id;
  pageNo = 1; renderTasks(); renderTimeline();
  document.getElementById("histTools").scrollIntoView({behavior:"smooth"});
}

/* ---------- 任务卡 ---------- */
function renderTasks(){
  const grid = document.getElementById("taskGrid");
  grid.innerHTML = DATA.tasks.filter(t=>fTask==="__all__"||t.id===fTask).map(t=>{
    const hasRed = (t.alerts||[]).some(a=>a.level==="red");
    /* 告警单一通道：橙/黄只走卡内告警条；红级额外保留边框强化 */
    const alarmCls = hasRed ? "alarm-red" : "";
    /* note 级（观察期/基线过低等非告警说明）降为标题旁浅色 pill，不再占整行灰条 */
    const alarms = (t.alerts||[]).filter(a=>a.level!=="note");
    const notes  = (t.alerts||[]).filter(a=>a.level==="note");
    const alerts = alarms.map(a=>
      `<div class="task-alert ${a.level}">⚠ ${esc(a.text)}</div>`).join("");
    const notePill = notes.length ? `<span class="npill" title="${esc(notes.map(a=>a.text).join("；"))}">ℹ ${esc(notes.length===1 ? (notes[0].text.length>16 ? notes[0].text.slice(0,16)+"…" : notes[0].text) : notes.length+" 条观察说明")}</span>` : "";
    const maxNew = Math.max(1, ...t.recent.map(r=>r.new||0));
    const n = t.recent.length;
    /* 日期轴防撞车：每根柱位宽约 (卡宽/n)px，标签 "MM-DD" 约 26px —— 保证每个标签 ≥6 柱位 */
    const step = Math.max(1, Math.ceil(n/6));
    const nv = t.recent.map(r=>r.new).filter(v=>v!=null);
    let band = "";
    if(nv.length>=4){
      const mean = nv.reduce((a,b)=>a+b,0)/nv.length;
      const sd = Math.sqrt(nv.reduce((a,b)=>a+(b-mean)**2,0)/nv.length);
      const bot = Math.max(0, Math.round(100*Math.max(0,mean-2*sd)/maxNew));
      const top = Math.min(100, Math.round(100*(mean+2*sd)/maxNew));
      const bh = Math.min(100, Math.max(3, top-bot));
      band = `<div class="band" style="bottom:${bot}%;height:${bh}%"></div>`;
    }
    const bars = band + t.recent.map((r,i)=>{
      const h = r.state==="failed"||r.state==="aborted"||r.state==="missed" ? 100
              : Math.max(6, Math.round(100*(r.new||0)/maxNew));
      const tip = `${r.date||r.dt.slice(0,10)} ${r.dt.slice(11,16)}｜${SL[r.state]}`+
                  (r.retries?`｜含重试 ${r.retries} 次`:"")+`｜新增 ${r.new==null?"-":r.new}`;
      return `<div class="bar ${i===n-1?'latest':''}" data-tip="${esc(tip)}"
        style="height:${h}%;background:${SC[r.state]}"></div>`;
    }).join("");
    const lines = (DATA.config_events||[]).map(e=>{
      const idx = t.recent.findIndex(r=>(r.date||r.dt.slice(0,10))>=e.date);
      return idx<0 ? "" :
        `<div class="cline" style="left:${(idx/n*100).toFixed(1)}%" title="配置变更：${esc(e.label)}"></div>`;
    }).join("");
    const dates = t.recent.map((r,i)=>
      `<span>${(i%step===0||i===n-1) ? esc((r.date||r.dt.slice(0,10)).slice(5)) : ''}</span>`).join("");
    const legend = ["success","zero_new","push_failed","failed","aborted"]
      .map(s=>`<span><i style="background:${SC[s]}"></i>${SL[s]}</span>`).join("") +
      `<span><i style="background:#1f2937;border-radius:50%"></i>最近一次</span>` +
      (nv.length>=4?`<span title="正常波动范围 = 近 14 次新增的均值 ±2 倍标准差（±2σ）；柱子超出灰带说明当日数据量显著偏离历史规律"><i style="background:rgba(100,116,139,.3);border-top:1px dashed #64748b;height:4px"></i>正常波动范围</span>`:"") +
      (lines?`<span><i style="background:none;border-left:2px dashed #b45309;height:9px;width:0;margin-right:1px"></i>配置变更</span>`:"");
    const durDelta = t.duration_delta_s==null ? "" :
      (t.duration_delta_s>=0 ? ` <span class="down">▲慢${fmtDur(t.duration_delta_s)}</span>`
                             : ` <span class="up">▼快${fmtDur(-t.duration_delta_s)}</span>`);
    const selCls = fTask===t.id ? " sel" : "";
    return `<div class="task ${alarmCls}${selCls}" onclick="setTaskFilter('${esc(t.id)}')">
      ${alerts}
      <div class="thead">
        <div>
          <div class="name" title="归档标题（日志 join 键）：${esc(t.push_title)}">${esc(t.name)}${t.ran_today?' <span class="muted" style="font-size:11px;font-weight:400">· 今日已跑</span>':(t.missed_today?' <span style="color:#7F1D1D;font-size:11px;font-weight:600">· 今日漏跑</span>':"")}${notePill}</div>
          <div class="ptitle">每日 ${esc(t.trigger_time)}${t.next_trigger?` · 下次 ${esc(t.next_trigger)}`:""}${t.owner?` · 负责人 ${esc(t.owner)}`:""}</div>
        </div>
        <span class="ghost">筛选记录 →</span>
      </div>
      <div class="statline">
        <span class="stat"><i>最近新增</i><b class="mono">${t.latest_new==null?"-":t.latest_new}</b> <em>条</em></span>
        <span class="sep"></span>
        <span class="stat"><i>耗时${t.latest_duration_s&&t.latest_duration_s>t.duration_warn_s?' <span style="color:#B45309">⚠超时</span>':''}</i>
          <b class="mono" style="${t.latest_duration_s&&t.latest_duration_s>t.duration_warn_s?'color:#B45309':''}">${fmtDur(t.latest_duration_s)}</b>${durDelta}</span>
        <span class="sep"></span>
        <span class="stat"><i>状态</i>${badge(t.latest_state)}</span>
      </div>
      <div class="row"><span class="muted" style="font-size:11.5px">最近运行 ${dash(t.latest_time)}${t.latest_ok_time?` · 最近成功 ${dash(t.latest_ok_time)}`:""}</span></div>
      <div class="bars">${bars ? bars + `<i class="peakline" title="历史峰值 ${maxNew} 条"></i><span class="ymax">峰值 ${maxNew}</span>` : '<span class="muted" style="font-size:12px">暂无运行</span>'}${lines}</div>
      <div class="daterow">${dates}</div>
      <div class="legend">${legend}</div>
    </div>`;
  }).join("") || '<div class="muted">无任务</div>';
}

/* ---------- 历史表 ---------- */
function noteOf(r){
  if(r.state==="failed") return r.reason || r.stage || r.handle || r.note;
  if(r.state==="aborted") return r.reason || r.stage;
  if(r.state==="missed") return r.reason;
  return r.note;
}
function inRange(r){
  const d = dpart(r.dt);
  if(rangeMode==="today") return d === DATA.today;
  if(rangeMode==="7d" || rangeMode==="30d"){
    const days = rangeMode==="7d"?6:29;
    const lo = new Date(DATA.today); lo.setDate(lo.getDate()-days);
    const loS = lo.toISOString().slice(0,10);
    return loS <= d && d <= DATA.today;
  }
  if(rangeMode==="custom"){
    if(rangeFrom && d < rangeFrom) return false;
    if(rangeTo && d > rangeTo) return false;
    return true;
  }
  return true;
}
function currentRows(){
  const src = mergeOn ? DATA.records_collapsed : DATA.records;
  return src.filter(r =>
    (fTask==="__all__" || r.task_id===fTask) &&
    fStates.has(r.state) && inRange(r));
}
/* 时间列单行压缩：MM-DD HH:MM（完整时间戳入 tooltip） */
function fmtShort(dt){ return (dt||"").slice(5,16); }
function renderHistTools(){
  const box = document.getElementById("histTools");
  box.innerHTML = `
    <span class="meta">范围：</span>
    ${[["all","全部"],["today","今天"],["7d","近7天"],["30d","近30天"]].map(([v,l])=>
      `<span class="chip range ${rangeMode===v?'':'off'}" data-v="${v}">${l}</span>`).join("")}
    <input type="date" id="dFrom"> <span class="meta">至</span> <input type="date" id="dTo">
    <span class="chip range ${rangeMode==='custom'?'':'off'}" data-v="custom">自定义</span>
    <label class="meta" style="cursor:pointer"><input type="checkbox" id="mergeChk" ${mergeOn?'checked':''}> 合并重试</label>`;
  box.querySelectorAll(".chip.range").forEach(ch=>{
    ch.onclick = ()=>{ rangeMode = ch.dataset.v; pageNo = 1; renderHistTools(); renderTimeline(); };
  });
  const df = document.getElementById("dFrom"), dt2 = document.getElementById("dTo");
  df.value = rangeFrom; dt2.value = rangeTo;
  df.onchange = ()=>{ rangeFrom = df.value; rangeMode = "custom"; pageNo = 1; renderHistTools(); renderTimeline(); };
  dt2.onchange = ()=>{ rangeTo = dt2.value; rangeMode = "custom"; pageNo = 1; renderHistTools(); renderTimeline(); };
  document.getElementById("mergeChk").onchange = e=>{ mergeOn = e.target.checked; pageNo = 1; renderTimeline(); };
}
/* ---------- 表头排序：时间/新增/耗时，点击切换升/降 ---------- */
let sortKey = "dt", sortDir = -1;
const SORT_DEFAULT_DIR = { dt:-1, new:-1, duration_s:-1 };
function setSort(k){
  if(sortKey===k) sortDir = -sortDir;
  else { sortKey = k; sortDir = SORT_DEFAULT_DIR[k] != null ? SORT_DEFAULT_DIR[k] : -1; }
  pageNo = 1; updateSortHeads(); renderTimeline();
}
function updateSortHeads(){
  document.querySelectorAll("th.sortable").forEach(th=>{
    const base = th.dataset.base || (th.dataset.base = th.textContent);
    th.innerHTML = esc(base) + (sortKey===th.dataset.k ? ` <span class="arr">${sortDir<0?"↓":"↑"}</span>` : "");
  });
}
function renderTimeline(){
  const rows = currentRows().slice().sort((a,b)=>{
    const va=a[sortKey], vb=b[sortKey];
    if(va==null||vb==null){ if(va==null&&vb==null) return a.dt<b.dt?1:-1; return va==null?1:-1; } // 空值沉底
    return (va<vb?-1:va>vb?1:0)*sortDir || (a.dt<b.dt?1:-1);
  });
  window._rows = rows;
  document.getElementById("tlCount").textContent = `（筛选后 ${rows.length} 条）`;
  updateChipCounts();
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  if(pageNo > pages) pageNo = pages;
  const off = (pageNo-1)*PAGE;
  const vis = rows.slice(off, document.body.classList.contains("tv") ? Math.min(10, off+PAGE) : off+PAGE);
  const tb = document.getElementById("tl");
  tb.innerHTML = vis.map((r,i)=>{
    const grab = r.grab==null ? "-" : fmtN(r.grab);
    const newCls = r.new==null ? "" : (r.new===0 ? "zero" :
      (medNew[r.task_id] && r.new > 2*medNew[r.task_id] ? "hot" : ""));
    const skipped = r.push_ok==null && (r.push_reason||"").indexOf("skipped")>=0;
    const dd = (r.grab!=null && r.new!=null && r.grab>0 && r.new<=r.grab)
      ? Math.round(100*(r.grab-r.new)/r.grab) : null;
    const st = badge(r.state) +
      (r.retries ? ` <span class="mini" title="${esc((r.states_seq||[]).join('→'))}">🔄 重试 ${r.retries} 次</span>` : "") +
      (r.push_ok===false ? ` <span class="mini amber" title="${esc(r.push_reason||'推送未达')}">⚠ 推送未达</span>` : "") +
      (skipped ? ` <span class="mini blue" title="${esc(r.push_reason)}">已静默跳过</span>` : "");
    const time = r.collapsed
      ? `${fmtShort(r.dt)} ~ ${fmtShort(r.end_dt).slice(6)||""}`
      : fmtShort(r.dt);
    const timeTitle = r.collapsed ? `${r.dt} ~ ${dash(r.end_dt)}（同一轮重试合并展示）` : r.dt;
    return `<tr class="rec" data-i="${i}" style="border-left:3px solid ${SC[r.state]}">
      <td class="mono" title="${esc(timeTitle)}">${time}</td>
      <td class="taskname" title="${esc(r.task_display)}">${esc(r.task_display)}</td>
      <td class="stcell">${st}</td>
      <td class="r"${dd!=null?` title="去重率 ${dd}%（=（抓取−新增）/ 抓取）"`:''}><span class="num mono ${newCls}">${fmtN(r.new)}</span></td>
      <td class="r"><span class="num mono">${grab}</span></td>
      <td class="r"><span class="num mono">${dash(r.pages)}</span></td>
      <td class="r mono ${r.duration_s>(DATA.settings.duration_warn_seconds||600)?'slow':''}" title="阈值 ${fmtDur(DATA.settings.duration_warn_seconds||600)}">${fmtDur(r.duration_s)}</td>
      <td>${dash(r.write)}</td>
      <td class="note" title="${esc(noteOf(r)||'')}"><span class="clamp2">${fmtText(noteOf(r))}</span></td></tr>`;
  }).join("") || '<tr><td colspan="9" class="muted">无匹配记录</td></tr>';
  tb.querySelectorAll("tr.rec").forEach(tr=>{
    tr.onclick = ()=> openDrawer(rows[+tr.dataset.i]);
    tr.tabIndex = 0;
    tr.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDrawer(rows[+tr.dataset.i]); } };
  });
  const remain = rows.length - off - vis.length;
  /* 分页器：固定每页 50 条，切页后表格滚回顶部（避免长列表 DOM 膨胀） */
  const lmw = document.getElementById("loadMoreWrap");
  if(pages > 1){
    lmw.innerHTML = `<span class="pg">
      <button onclick="gotoPage(${pageNo-1})" ${pageNo<=1?"disabled":""}>‹ 上一页</button>
      <span>第 <b class="mono">${pageNo}</b> / ${pages} 页 · 共 ${rows.length} 条</span>
      <button onclick="gotoPage(${pageNo+1})" ${pageNo>=pages?"disabled":""}>下一页 ›</button></span>`;
  } else lmw.innerHTML = "";
  const sumF = rows.reduce((a,r)=>a+(r.new||0),0);
  document.getElementById("tfoot").innerHTML =
    `<tr><td colspan="9">新增合计 · 当前筛选范围：<b class="mono">${sumF.toLocaleString("zh-CN")}</b> 条
      ｜ 全部记录（已剔除同日补推重复）：<b class="mono">${DATA.history_summary.total_new.toLocaleString("zh-CN")}</b> 条
      <span class="muted">（执行失败/中止/漏跑不计新增）</span></td></tr>`;
}
function gotoPage(p){
  pageNo = p; renderTimeline();
  const el = document.getElementById("histTools");
  if(el) el.scrollIntoView({block:"start", behavior:"smooth"});
}

/* ---------- 侧边抽屉：统一详情模板（分块 + 日志高亮 + 底部主 CTA） ---------- */
function lastOkBefore(taskId, dt){
  const oks = DATA.records.filter(r=>r.task_id===taskId &&
    (r.state==="success"||r.state==="zero_new"||r.state==="push_failed")
    && r.dt < dt).map(r=>r.dt).sort().reverse();
  return oks.length ? oks[0] : null;
}
function daysSince(dt){
  if(!dt) return null;
  const d1 = new Date(DATA.today), d2 = new Date(dt.slice(0,10));
  return Math.round((d1-d2)/86400000);
}
function isEnvDead(r){
  const t = ((r.reason||"")+(r.stage||"")+(r.handle||"")+(r.note||"")).toLowerCase();
  return ["扩展","chrome","bsk","daemon","卡死","假连接","service worker","浏览器"]
    .some(k=>t.indexOf(k)>=0);
}
const SRC_NAME = {wx_push:"微信留档", runs:"runs.jsonl 埋点",
                  memory:"自动化运行记忆", derived:"漏跑检测"};
/* 失败原因关键词高亮：单趟正则替换，避免嵌套包裹 */
function hlKeywords(s){
  if(!s) return "-";
  const kws = ["Chrome","扩展","bsk","daemon","卡死","假连接","登录态","超时","timeout",
               "写入失败","失败","error","Error"];
  const re = new RegExp("(" + kws.map(k=>k.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\$&")).join("|") + ")","gi");
  return esc(s).replace(re,'<mark>$1</mark>');
}
/* 失败原因结构化：第一行 = 失败环节（加粗红字），第二行 = 具体错误摘要（灰字）；
   长堆栈默认截断，提供「查看完整堆栈」展开，避免占据大量视觉空间 */
function failReasonHtml(r){
  const stage = (r.stage||"").trim();
  const body = ((r.reason||"")+"").trim() || ((r.handle||"")+"").trim();
  const title = stage || ({aborted:"任务中止",missed:"任务漏跑",failed:"浏览器抓取环节失败"}[r.state]||"执行异常");
  const showBody = body && body!==title;
  const needFold = body.length > 120;
  const short = needFold ? body.slice(0,120)+"…" : "";   // 未超长时只渲染 rfull，避免重复
  const foldBtn = needFold
    ? ` <button class="lnk" onclick="(function(b){const w=b.parentNode,f=w.querySelector('.rfull'),s=w.querySelector('.rshort');const show=f.style.display==='none';f.style.display=show?'':'none';s.style.display=show?'none':'';b.textContent=show?'收起':'查看完整堆栈';})(this)">查看完整堆栈</button>`
    : "";
  return `<span class="k2">失败原因</span><span class="v2">` +
    `<b style="color:#B91C1C">${esc(title)}</b>` +
    (showBody?`<div class="muted" style="font-size:12px;margin-top:3px;line-height:1.6">`+
      `<span class="rshort">${hlKeywords(short)}</span>`+
      `<span class="rfull" style="${needFold?'display:none':''}">${hlKeywords(body)}</span>${foldBtn}</div>`:"") +
    `</span>`;
}
/* 原始日志高亮：时间戳灰、✅绿、❌/失败行红、sender 区灰斜体 */
function formatLog(raw){
  if(!raw) return "（无原文）";
  return esc(raw).split("\n").map(line=>{
    let cls = "";
    if(/^\[\d{4}-\d{2}-\d{2}/.test(line)){
      line = line.replace(/^(\[\d{4}-\d{2}-\d{2}[^\]]*\])/, '<span class="ltime">$1</span>');
    }
    if(line.indexOf("---- sender")>=0) cls += " ldim";
    line = line.replace(/✅/g,'<span class="lok">✅</span>').replace(/❌/g,'<span class="lerr">❌</span>');
    if(/^(阶段|原因|失败环节)[:：]/.test(line.replace(/<[^>]+>/g,""))) cls += " lerrline";
    else if(/(一致 ✅|核对.*✅)$/.test(line)) cls += " lokline";
    return cls ? `<span class="${cls}">${line}</span>` : line;
  }).join("\n");
}
/* 耗时趋势迷你图：该次之前同任务近 10 次运行的 SVG 折线；超阈值点标红 */
function durSpark(r){
  const pts = DATA.records
    .filter(x=>x.task_id===r.task_id && x.duration_s!=null && x.dt<=r.dt)
    .sort((a,b)=>a.dt<b.dt?-1:1).slice(-10);
  if(pts.length<2) return `<span class="muted" style="font-size:12px">样本不足，暂无趋势</span>`;
  const vs = pts.map(x=>x.duration_s);
  const mx = Math.max(...vs), mn = Math.min(...vs);
  const W=170, H=34, P=4;
  const xy = vs.map((v,i)=>[P+i*(W-2*P)/(vs.length-1), H-P-(v-mn)/((mx-mn)||1)*(H-2*P)]);
  const warn = DATA.settings.duration_warn_seconds || 600;
  const poly = xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots = xy.map((p,i)=>
    `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2"
      fill="${vs[i]>warn?'#EF4444':'#2563EB'}"><title>${esc(pts[i].dt)} · ${fmtDur(vs[i])}</title></circle>`).join("");
  return `<svg width="${W}" height="${H}" style="vertical-align:middle" role="img" aria-label="近${vs.length}次耗时趋势">
      <polyline points="${poly}" fill="none" stroke="#2563EB" stroke-width="1.5" opacity=".65"/>${dots}</svg>
    <span class="muted" style="font-size:11px;margin-left:4px">近 ${vs.length} 次 · 阈值 ${fmtDur(warn)}${mx>warn?" · 有超时点(红)":""}</span>`;
}
function openDrawer(r){
  const d = document.getElementById("drawer");
  const dd = (r.grab!=null && r.new!=null && r.grab>0 && r.new<=r.grab)
    ? Math.round(100*(r.grab-r.new)/r.grab) : null;
  const skipped = r.push_ok==null && (r.push_reason||"").indexOf("skipped")>=0;
  const pushCell = r.push_ok===true ? "送达 ✅"
    : r.push_ok===false ? `未达 ❌（${esc(r.push_reason||"")}）`
    : skipped ? "静默跳过（--no-push，预期行为，非故障）"
    : "未尝试 / 不适用";
  const slow = r.duration_s && r.duration_s > (DATA.settings.duration_warn_seconds||600);
  const isBad = ["failed","aborted","missed"].includes(r.state) || r.push_ok===false;
  const okB = lastOkBefore(r.task_id, r.dt);
  const okDays = okB ? daysSince(okB) : null;
  const okCell = okB
    ? `${esc(okB)}<span class="muted">（该次之前最近成功 · 距今 ${okDays} 天）</span>`
    : "该次之前无成功记录";
  const cta = !isBad
    ? `<div class="noop ok"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="#10B981" stroke-width="1.5"/><path d="M5 8.2l2.2 2.2L11.2 6" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>状态健康，无需操作</div>`
    : isEnvDead(r)
      ? `<button class="cta env" onclick="copyRetry(this)">⚠️ 环境类故障 — 复制「先恢复 Chrome / daemon 再重跑」指令</button>`
      : `<button class="cta" onclick="copyRetry(this)">📋 复制重试指令（粘贴给助手即可执行）</button>`;
  /* 记录 x/N 快速跳转：下拉列出当前筛选结果，配合键盘 ↑↓ 逐条切换 */
  const _rs = window._rows || [];
  const _ix = _rs.findIndex(x=>x.dt===r.dt && x.task_id===r.task_id);
  const navSel = _rs.length>1
    ? ` · <select id="dnav" onchange="jumpRecord(+this.value)" title="跳转到当前筛选列表中的任一记录（键盘 ↑↓ 逐条切换）">` +
      _rs.map((x,i)=>`<option value="${i}"${i===_ix?" selected":""}>记录 ${i+1} / ${_rs.length} · ${fmtShort(x.dt)} ${esc(x.task_display)}</option>`).join("") +
      `</select>` : "";
  d.innerHTML = `
    <div class="dbody">
      <button class="close" onclick="closeDrawer()" title="关闭">×</button>
      <h3>${esc(r.task_display)}</h3>
      <div class="dsub">${dash(r.dt)}${r.end_dt?` ～ ${dash(r.end_dt)}`:""} · 来源：${SRC_NAME[r.source]||"-"}${navSel}</div>
      <div class="sect">概要</div>
      <div class="kv">
        <span class="k2">状态</span><span class="v2">${badge(r.state)}${r.retries?` <span class="mini" title="${esc((r.states_seq||[]).join("→"))}">🔄 重试 ${r.retries} 次</span>`:""}</span>
        ${isBad&&r.state!=="push_failed"?failReasonHtml(r):""}
        <span class="k2">备注</span><span class="v2">${dash(r.note)}</span>
        <span class="k2">此前最近成功</span><span class="v2">${okCell}</span>
      </div>
      <div class="sect">数据与核对</div>
      <div class="kv">
        <span class="k2">新增</span><span class="v2"><span class="num mono">${fmtN(r.new)}</span> 条${dd!=null?` · 去重率 ${dd}%`:""}</span>
        <span class="k2">抓取</span><span class="v2 mono">${fmtN(r.grab)} 条 / ${dash(r.pages)} 页</span>
        <span class="k2">写入</span><span class="v2">${dash(r.write)}</span>
        <span class="k2">核对</span><span class="v2">${dash(r.check)}</span>
        <span class="k2">耗时</span><span class="v2 mono ${slow?'slow':''}">${fmtDur(r.duration_s)}${slow?" ⚠ 超过阈值":""}</span>
        <span class="k2">耗时趋势</span><span class="v2">${durSpark(r)}</span>
      </div>
      <div class="sect">链路与通知</div>
      <div class="kv">
        <span class="k2">通知</span><span class="v2">${pushCell}</span>
        <span class="k2">来源</span><span class="v2">${SRC_NAME[r.source]||"-"}</span>
      </div>
      <div class="loghead" id="logHead"><span class="sect" style="margin:0">原始日志</span>
        <span style="display:flex;gap:8px;align-items:center">
          <button class="lnk" id="logErrBtn" onclick="toggleLogErr()">仅看错误</button>
          <button class="lnk" id="logJumpBtn" onclick="jumpToErr()" style="display:none">↓ 定位错误行</button>
          <input id="logSearch" placeholder="搜索日志…" oninput="window._logQ=this.value;renderLog()"
                 style="font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px">
          <span class="mini blue" id="logQCount" style="display:none"></span>
          <button class="lnk" id="copyLogBtn" onclick="copyLog(this)">复制全部日志</button>
        </span></div>
      <pre class="raw" id="logPre"></pre>
    </div>
    <div class="dfoot">${cta}</div>`;
  window._logErrOnly = false; window._logQ = "";
  document.getElementById("logHead").style.display = r.raw ? "" : "none";
  renderLog();
  d.classList.add("show");
  document.getElementById("drawerMask").classList.add("show");
  document.body.classList.add("dlock");
  const cb = d.querySelector(".close"); if(cb) cb.focus();
  window._drawerRec = r;
  highlightRow(r);
}
/* 主表联动：当前查看的记录行加浅蓝高亮并滚动到视野中央（关闭抽屉后仍保留，便于知道排查到哪） */
function highlightRow(r){
  document.querySelectorAll("tr.rec.rowhl").forEach(t=>t.classList.remove("rowhl"));
  const rows = window._rows || [];
  const ix = rows.findIndex(x=>x.dt===r.dt && x.task_id===r.task_id && x.state===r.state);
  if(ix<0) return;
  const off = (pageNo-1)*PAGE;
  const tr = document.querySelectorAll("#tl tr.rec")[ix-off];
  if(!tr) return;   // 不在当前页则跳过高亮
  tr.classList.add("rowhl");
  tr.scrollIntoView({block:"center", behavior:"smooth"});
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawerMask").classList.remove("show");
  document.body.classList.remove("dlock");
}
/* Esc 关闭抽屉；键盘 ↑↓ 在当前筛选列表中逐条切换记录 */
document.addEventListener("keydown", e=>{
  const d = document.getElementById("drawer");
  if(e.key==="Escape" && d.classList.contains("show")) closeDrawer();
  if(!d.classList.contains("show")) return;
  if(e.target && (e.target.tagName==="SELECT" || e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA")) return;
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    const rs = window._rows || [], cur = window._drawerRec || {};
    const ix = rs.findIndex(x=>x.dt===cur.dt && x.task_id===cur.task_id);
    const ni = ix + (e.key==="ArrowDown"?1:-1);
    if(ni>=0 && ni<rs.length) openDrawer(rs[ni]);
  }
});
function jumpRecord(i){ const rs = window._rows||[]; if(rs[i]) openDrawer(rs[i]); }
/* 日志区：仅看错误 / 搜索高亮 / 定位第一条错误行（配合 formatLog 的高亮规则叠加） */
function renderLog(){
  const pre = document.getElementById("logPre");
  if(!pre) return;
  const r = window._drawerRec || {};
  /* 空状态：不只是一个灰白的"（无原文）"，给出解释与就近日志入口 */
  if(!r.raw){
    const cands = DATA.records.filter(x=>x.task_id===r.task_id && x.raw)
      .sort((a,b)=>Math.abs(new Date(a.dt)-new Date(r.dt)) - Math.abs(new Date(b.dt)-new Date(r.dt)));
    const near = cands[0];
    if(near) window._nearRawRec = near;
    pre.innerHTML = `<div style="padding:20px 10px;color:#6B7280;font-size:12.5px;line-height:2">
      📭 该次运行未记录原始日志。<br>
      数据来源：${SRC_NAME[r.source]||"-"} —— runs.jsonl 埋点可能是历史数据，或静默跳过不输出日志。
      ${near?`<div style="margin-top:6px"><button class="lnk" onclick="openDrawer(window._nearRawRec)">→ 查看该任务最近一次有日志的记录（${fmtShort(near.dt)}）</button></div>`:""}
    </div>`;
    const jb2 = document.getElementById("logJumpBtn");
    if(jb2) jb2.style.display = "none";
    return;
  }
  let lines = (r.raw||"").split("\n");
  const isErrLine = l => /❌|失败|阶段[:：]|原因[:：]|错误|error|ret|prepare failed/i.test(l);
  if(window._logErrOnly) lines = lines.filter(isErrLine);
  const q = (window._logQ||"").trim();
  const re = q ? new RegExp("(" + q.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\$&") + ")","gi") : null;
  let errIdx = -1;
  const out = lines.map((l,i)=>{
    if(errIdx<0 && isErrLine(l)) errIdx = i;
    let h = formatLog(l);
    if(re) h = h.replace(re,'<mark class="qmark">$1</mark>');
    return h;
  });
  if(errIdx>=0) out[errIdx] = '<span id="firstErrLine">' + out[errIdx] + '</span>';
  pre.innerHTML = lines.length ? out.join("\n") : "（无匹配行）";
  const jb = document.getElementById("logJumpBtn");
  if(jb) jb.style.display = errIdx>=0 ? "" : "none";
  /* 搜索匹配行数即时反馈 */
  const qc = document.getElementById("logQCount");
  if(qc){
    if(!q){ qc.style.display = "none"; }
    else {
      let n = 0; lines.forEach(l=>{ if(re && re.test(l)) n++; re.lastIndex = 0; });
      qc.textContent = n ? `${n} 行匹配` : "无匹配";
      qc.style.display = "";
    }
  }
}
/* 在日志框内居中定位第一条错误行（不跳动整个页面） */
function jumpToErr(){
  const el = document.getElementById("firstErrLine");
  const pre = document.getElementById("logPre");
  if(!el || !pre){ toast("未找到错误行"); return; }
  const pr = pre.getBoundingClientRect(), er = el.getBoundingClientRect();
  pre.scrollTop += er.top - pr.top - pr.height/2;
  toast("已定位到第一条错误行");
}
function toggleLogErr(){
  window._logErrOnly = !window._logErrOnly;
  const b = document.getElementById("logErrBtn");
  if(b){ b.textContent = window._logErrOnly ? "✕ 显示全部" : "仅看错误";
         b.style.fontWeight = window._logErrOnly ? "700" : "400";
         b.style.color = window._logErrOnly ? "#B91C1C" : ""; }
  renderLog();
}
function copyRetry(btn){
  if(btn.dataset.lock) return;   // 防呆：倒计时期间禁止重复复制
  const r = window._drawerRec || {};
  const reason = r.reason || r.push_reason || r.stage || "";
  const msg = isEnvDead(r)
    ? `Chrome/扩展环境异常，需人工恢复后重跑任务「${r.task_display}」（${r.dt} 失败：${reason}）。步骤：① 人工确认 Chrome 可正常打开并已登录 pigeon；② 杀 bsk 进程 → 后台跑 bsk daemon start --foreground → 等 15 秒 → bsk status 确认 browsers connected=1；③ 回复本条消息，助手按该任务既有流程重跑：抓取→增量写入钉钉表格→回读核对→静默留档。`
    : `请重新执行定时任务「${r.task_display}」：${r.dt} 该次运行为「${SL[r.state]}」${reason?`（原因：${reason}）`:""}。请按该任务既有流程重跑：抓取→增量写入钉钉表格→回读核对→静默留档，完成后报告结果。`;
  const orig = btn.textContent;
  const done = ()=>{
    toast("✅ 重试指令已复制，请粘贴给助手执行");
    btn.dataset.lock = "1"; btn.disabled = true;
    btn.style.opacity = ".65"; btn.style.cursor = "not-allowed";
    let s = 5;
    btn.textContent = `✅ 已复制，${s} 秒后可再次复制`;
    const iv = setInterval(()=>{
      s--;
      if(s<=0){ clearInterval(iv); btn.dataset.lock=""; btn.disabled=false;
                btn.style.opacity=""; btn.style.cursor=""; btn.textContent=orig; }
      else btn.textContent = `✅ 已复制，${s} 秒后可再次复制`;
    }, 1000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(done).catch(()=>fallbackCopy(msg,done));
  } else fallbackCopy(msg,done);
}
function copyLog(btn){
  const r = window._drawerRec || {};
  const orig = btn ? btn.textContent : "";
  const done = ()=>{
    toast("✅ 日志已复制到剪贴板");
    if(btn){ btn.textContent = "✅ 已复制";
             setTimeout(()=>{ btn.textContent = orig; }, 1600); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(r.raw||"").then(done).catch(()=>fallbackCopy(r.raw||"",done));
  } else fallbackCopy(r.raw||"",done);
}
function fallbackCopy(text,done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}
document.getElementById("drawerMask").onclick = closeDrawer;

/* ---------- 告警与页脚 ---------- */
function renderWarnings(){
  const w = DATA.warnings;
  if(!w.length) return;
  document.getElementById("warnings").innerHTML =
    `<div class="warn">⚠ 有 ${w.length} 段日志解析失败（不影响其余数据）` +
    w.map(x=>`<details><summary>${esc(x.file)}</summary><pre class="raw">${esc(x.raw)}</pre></details>`).join("") +
    `</div>`;
}
const GEN_MS = new Date(DATA.generated_at).getTime();
function tick(){
  const m = Math.max(0, Math.floor((Date.now()-GEN_MS)/60000));
  document.getElementById("openMin").textContent =
    `数据 ${m} 分钟前更新 · 页面每 5 分钟自动重载`;
  /* 数据延迟兜底：超过 1 小时未更新 → 顶部黄色告警条，不让用户自己算时间差 */
  const sb = document.getElementById("staleBar");
  if(sb){
    if(m >= 60){
      sb.className = "show";
      sb.innerHTML = `⚠️ 数据已超过 1 小时未更新（已 ${m} 分钟），自动重载可能一直在拿旧文件——可能遇到抓取阻塞或构建失败，请检查定时任务或手动运行 build_dashboard.py`;
    } else { sb.className = ""; sb.innerHTML = ""; }
  }
}

/* ---------- 依赖健康度（由运行记录推导）：Chrome/扩展/bsk 环境是本系统最脆弱的依赖 ---------- */
function renderDepHealth(){
  const el = document.getElementById("depHealth");
  const env = DATA.records.filter(isEnvDead).sort((a,b)=>a.dt<b.dt?1:-1);
  const now = Date.now();
  const n24 = env.filter(r=>now - new Date(r.dt).getTime() < 86400000).length;
  const n7  = env.length;   // 记录窗口即近 7~30 天，全量即近期口径
  const last = env[0];
  const ok = n24 === 0;
  const dot = ok ? "var(--ok)" : (n24>=3 ? "var(--err)" : "var(--warn)");
  el.innerHTML = `
    <i class="ddot" style="background:${dot}"></i>
    <b style="font-size:12.5px">依赖健康度</b>
    <span>Chrome / 扩展 / bsk 环境链路：近 24h 环境类故障 <b class="mono" style="color:${ok?'#047857':'#B91C1C'}">${n24}</b> 次 · 记录窗口内共 ${n7} 次</span>
    ${last?`<span class="muted">最近一次：${fmtShort(last.dt)} ${esc(last.task_display||"")}</span>`:""}
    <span class="muted">（由运行记录推导 · 静态看板无法实时探测 daemon 存活，一键重启需后端支持）</span>`;
}

renderBanner(); renderSummary(); renderCauses(); renderUnreg(); renderFilters(); renderTasks();
renderDepHealth(); renderHistTools(); renderTimeline(); renderWarnings();

updateSortHeads();
tick(); setInterval(tick, 30000);
document.getElementById("foot").innerHTML =
  "漏跑判定以生成时刻为准（缓冲 " + DATA.settings.miss_buffer_minutes +
  " 分钟）· 耗时/去重率来自 runs.jsonl 埋点（旧数据无此字段显示 -）· 由 build_dashboard.py 生成于 " + DATA.generated_at;
</script>
